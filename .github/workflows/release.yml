name: Release

# Push a tag like v2.1.0 to build Windows / macOS / Linux packages. The release is created as a DRAFT with the
# macOS and Linux files and latest-linux.yml. Windows is signed outside CI (scripts/release-windows.ps1 signs on
# the Siam host with the SSL.com eSigner certificate, uploads the installer and latest.yml, then publishes the
# draft). Run manually (Actions → Release → Run workflow) to build without releasing; files land in the artifacts.
on:
  push:
    tags: ['v*']
    # Every push to main also builds the packages (no release), so packaging breaks show up early.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ''
      - name: Build
        shell: bash
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked
      - name: Installer (unsigned, for checking)
        shell: pwsh
        run: |
          $v = (Select-String Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $mk = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $mk) { choco install nsis -y --no-progress | Out-Null; $mk = 'C:\Program Files (x86)\NSIS\makensis.exe' }
          New-Item -ItemType Directory -Force dist | Out-Null
          & $mk /V2 "/DVERSION=$v" "/DEXE_PATH=$PWD\target\release\ai-quota-overlay.exe" "/DOUTFILE=$PWD\dist\AiQuotaOverlay-$v-win-x64-setup.exe" installer\installer.nsi
          if ($LASTEXITCODE) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: dist/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          rustflags: ''
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: App bundle and dmg
        run: bash scripts/package-mac.sh ${{ matrix.target }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ''
      - run: cargo build --release --locked
      - name: AppImage, deb and latest-linux.yml
        run: bash scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml
          if-no-files-found: error

  release:
    needs: [windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '{mac-*,linux}'
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
          generate_release_notes: true
          body: |
            ## Download

            | OS | File |
            |---|---|
            | Windows 10/11 | `AiQuotaOverlay-*-win-x64-setup.exe` |
            | macOS (Apple Silicon) | `AiQuotaOverlay-*-mac-arm64.dmg` |
            | macOS (Intel) | `AiQuotaOverlay-*-mac-x64.dmg` |
            | Linux | `AiQuotaOverlay-*-linux-x86_64.AppImage` or `.deb` |

            The Windows build is signed. The macOS builds are not: see the README for the one-time "open anyway" step.
