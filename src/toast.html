<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Update</title>
<style>
  :root {
    --panel: rgba(22, 24, 31, 0.97);
    --line: rgba(255, 255, 255, 0.08);
    --text: #eceef2;
    --muted: #8b90a0;
    --accent: #8b9cff;
    --accent-2: #b38bff;
    --bad: #f87171;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; overflow: hidden; }
  body {
    position: fixed; inset: 0;
    font: 11px/1.35 "Segoe UI", "Leelawadee UI", Tahoma, sans-serif;
    color: var(--text);
    user-select: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; }

  /* Main fits the window around .toast and places it where the detail panel opens. */
  .toast {
    position: absolute; left: 2px; top: 2px;
    width: 236px;
    padding: 11px 12px 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, .25);
    overflow: hidden;
    animation: pop .18s ease-out;
  }
  .toast[hidden] { display: none; }
  .toast::before {
    content: ""; position: absolute; left: 14px; right: 14px; top: 0; height: 2px; border-radius: 0 0 2px 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
  }
  .toast.err::before { background: var(--bad); }
  @keyframes pop { from { opacity: 0; transform: translateY(4px) scale(.98); } to { opacity: 1; transform: none; } }

  .head { display: flex; align-items: center; gap: 9px; }
  .badge {
    flex: none; width: 30px; height: 30px; border-radius: 10px;
    display: grid; place-items: center; color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 2px 10px color-mix(in srgb, var(--accent) 45%, transparent);
  }
  .err .badge { background: color-mix(in srgb, var(--bad) 85%, #000); box-shadow: 0 2px 10px color-mix(in srgb, var(--bad) 40%, transparent); }
  .busy .badge svg { animation: bob 1.1s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(2px); } }
  .installing .badge svg { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .titles { flex: 1; min-width: 0; }
  .title { font-weight: 600; font-size: 12px; }
  .sub { color: var(--muted); font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .close {
    flex: none; align-self: flex-start; width: 20px; height: 20px; border-radius: 6px; margin: -3px -4px 0 0;
    background: transparent; color: var(--muted); font-size: 15px; line-height: 20px;
  }
  .close:hover { background: rgba(255, 255, 255, .08); color: var(--text); }

  .actions { display: flex; gap: 6px; margin-top: 10px; }
  .btn {
    flex: 1; padding: 6px 8px; border-radius: 8px; font-weight: 600; font-size: 11px;
    background: rgba(255, 255, 255, .06); color: var(--muted);
    transition: background .12s, color .12s, filter .12s;
  }
  .btn:hover { background: rgba(255, 255, 255, .11); color: var(--text); }
  .btn.primary { color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .btn.primary:hover { filter: brightness(1.1); }

  .bar { margin-top: 10px; height: 5px; border-radius: 5px; background: rgba(255, 255, 255, .09); overflow: hidden; }
  .bar i {
    display: block; height: 100%; width: var(--p, 0%); border-radius: 5px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent));
    background-size: 200% 100%;
    animation: flow 1.2s linear infinite;
    transition: width .25s ease-out;
  }
  @keyframes flow { to { background-position: -200% 0; } }
  .pct { font-weight: 700; color: var(--text); font-size: 11.5px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="toast" id="toast" hidden></div>
<script src="i18n.js"></script>
<script>
  const root = document.getElementById('toast');
  const ICON_UP = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg>';
  const ICON_DOWN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5.5 12.5 12 19l6.5-6.5"/></svg>';
  const ICON_SPIN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3a9 9 0 1 1-9 9"/></svg>';
  const ICON_WARN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 7v6M12 17h.01"/></svg>';

  let lang = 'en';
  let u = null;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function render() {
    const t = I18N.t(lang).u;
    const head = (cls, icon, title, sub, closable) => {
      root.className = `toast ${cls}`;
      return `<div class="head"><div class="badge">${icon}</div>
        <div class="titles"><div class="title">${esc(title)}</div><div class="sub">${sub}</div></div>
        ${closable ? `<button class="close" data-a="dismiss" title="${esc(t.later)}">×</button>` : ''}</div>`;
    };
    let html = '';
    switch (u?.phase) {
      case 'available':
        html = head('', ICON_UP, t.available, esc(t.fromTo(u.current, u.version)), true)
          + `<div class="actions"><button class="btn primary" data-a="download">${esc(u.manual ? t.download : t.update)}</button>
             <button class="btn" data-a="skip">${esc(t.skip)}</button></div>`;
        break;
      case 'downloading':
        html = head('busy', ICON_DOWN, t.downloading(u.version), `<span class="pct">${u.percent ?? 0}%</span>`, false)
          + `<div class="bar" style="--p:${u.percent ?? 0}%"><i></i></div>`;
        break;
      case 'installing':
        html = head('installing', ICON_SPIN, t.installing(u.version), esc(t.restartNote), false)
          + '<div class="bar" style="--p:100%"><i></i></div>';
        break;
      case 'error':
        html = head('err', ICON_WARN, t.failed, esc(u.error?.message ?? ''), true)
          + `<div class="actions"><button class="btn primary" data-a="download">${esc(t.retry)}</button>
             <button class="btn" data-a="skip">${esc(t.skip)}</button></div>`;
        break;
    }
    root.hidden = !html;
    if (html) root.innerHTML = html;
    reportSize();
  }

  // Main fits the window around the toast (0×0 hides it).
  function reportSize() {
    const r = root.getBoundingClientRect();
    window.overlay.size({ w: root.hidden ? 0 : r.width, h: root.hidden ? 0 : r.height });
  }
  new ResizeObserver(reportSize).observe(root);

  window.overlay.onUpdate((next) => { u = next; render(); });
  window.overlay.onSettings((cfg) => { lang = cfg.lang; render(); });
  root.addEventListener('click', (e) => {
    const a = e.target.closest('[data-a]')?.dataset.a;
    if (a) window.overlay.update(a);
  });
</script>
</body>
</html>
