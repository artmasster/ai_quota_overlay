<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Quota overlay</title>
<style>
  :root {
    --bg: rgba(17, 19, 24, 0.86);
    --panel: rgba(22, 24, 31, 0.96);
    --line: rgba(255, 255, 255, 0.08);
    --text: #eceef2;
    --muted: #8b90a0;
    --track: rgba(255, 255, 255, 0.12);
    --ok: #4ade80;
    --warn: #fbbf24;
    --bad: #f87171;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; overflow: hidden; }
  body {
    position: fixed;
    inset: 0;
    font: 11px/1.3 "Segoe UI", "Leelawadee UI", Tahoma, sans-serif;
    color: var(--text);
    user-select: none;
  }
  /* The page runs in two windows, the card's and the panel's; each window is fitted around its element. */
  body.view-card .detail, body.view-panel .card { display: none; }

  /* ---------- compact card ---------- */
  .card {
    position: absolute; left: 2px; top: 2px;
    display: flex; gap: 10px;
    padding: 6px 9px 5px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    white-space: nowrap;
    cursor: grab;
    transition: border-color .15s;
  }
  .card:hover { border-color: rgba(255, 255, 255, .2); }
  body.dragging .card { cursor: grabbing; }
  body.loading .card { border-color: rgba(255, 255, 255, .3); }
  .svc { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .svc + .svc { padding-left: 10px; border-left: 1px solid var(--line); }
  .name { font-size: 10px; font-weight: 600; letter-spacing: .02em; }
  .rings { display: flex; gap: 6px; }
  body.vertical .card { flex-direction: column; gap: 6px; padding: 7px 6px 5px; }
  body.vertical .svc + .svc { padding-left: 0; border-left: 0; padding-top: 6px; border-top: 1px solid var(--line); }
  body.vertical .rings { flex-direction: column; gap: 3px; }
  body.vertical .empty { white-space: normal; width: 70px; text-align: center; }
  .ring {
    display: flex; flex-direction: column; align-items: center;
    border-radius: 9px; padding: 2px 2px 1px;
    cursor: pointer;
    transition: background .12s, box-shadow .12s;
  }
  .ring:hover { background: rgba(255, 255, 255, .07); }
  .ring.sel { background: color-mix(in srgb, var(--accent) 20%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent); }
  .ring svg { display: block; }
  .ring text { font-weight: 700; font-size: 10.5px; fill: var(--text); font-variant-numeric: tabular-nums; }
  .lbl { color: var(--muted); font-size: 9.5px; margin-top: 1px; }
  .empty { color: var(--muted); padding: 2px 4px; }
  .net + .empty { margin-left: 10px; border-left: 1px solid var(--line); padding-left: 10px; }

  /* Internet status: a solid round light, green with the ping when online, flashing red when offline. */
  .net .name { color: var(--ok); }
  .net-light { padding: 2px 2px 1px; display: flex; flex-direction: column; align-items: center; }
  .net-dot {
    width: 36px; height: 36px; border-radius: 50%;
    display: grid; place-items: center;
    color: #0b1a10; background: var(--ok);
    box-shadow: 0 0 10px color-mix(in srgb, var(--ok) 55%, transparent);
  }
  .net.off .name, .net.off .lbl { color: var(--bad); font-weight: 700; }
  .net.off .net-dot { color: #fff; background: var(--bad); animation: alarm 1s ease-in-out infinite; }
  @keyframes alarm {
    50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--bad) 35%, transparent), 0 0 16px var(--bad); opacity: .75; }
  }
  body.offline .card, body.offline .card:hover { border-color: var(--bad); }

  /* ---------- detail panel ---------- */
  .detail {
    position: absolute; left: 2px; top: 2px;
    width: 248px;
    padding: 10px 12px 11px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, .25);
    display: none;
    cursor: default;
  }
  .detail::before {
    content: ""; position: absolute; left: 14px; right: 14px; top: 0; height: 2px;
    border-radius: 0 0 2px 2px; background: var(--accent);
  }
  /* Laid out hidden first so main can move the window into place, then revealed. */
  .detail.open { display: block; visibility: hidden; }
  .detail.show { visibility: visible; animation: pop .14s ease-out; }
  @keyframes pop { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }
  .d-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .d-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .d-name { font-weight: 600; font-size: 12.5px; }
  .d-badge {
    font-size: 9.5px; font-weight: 600; letter-spacing: .06em;
    color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent);
    padding: 1px 6px; border-radius: 6px;
  }
  .d-close {
    margin-left: auto; width: 20px; height: 20px; border: 0; border-radius: 6px;
    background: transparent; color: var(--muted); font-size: 15px; line-height: 20px; cursor: pointer;
  }
  .d-close:hover { background: rgba(255, 255, 255, .08); color: var(--text); }
  .d-main { display: flex; align-items: center; gap: 12px; }
  .d-main svg { flex: none; }
  .d-main svg text { fill: var(--muted); font-size: 11px; font-weight: 600; }
  .d-big { font-size: 26px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .d-big small { font-size: 13px; font-weight: 600; margin-left: 1px; }
  .d-cap { color: var(--muted); font-size: 11px; margin-top: 3px; }
  .d-rows { margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--line); display: grid; gap: 4px; }
  .d-row { display: flex; align-items: center; gap: 7px; font-size: 11.5px; }
  .d-row svg { flex: none; opacity: .75; }
  .d-row .when { margin-left: auto; color: var(--muted); font-size: 11px; }
  .d-err { color: var(--warn); font-size: 11.5px; line-height: 1.45; }
  .d-hint { color: var(--muted); font-size: 10.5px; margin-top: 6px; }
  .d-win { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* "⋯" at the end of the card: opens the Settings window. Faint until the card is hovered. */
  .more {
    display: grid; place-items: center; align-self: stretch;
    width: 14px; margin: -2px -5px -1px -4px; border-radius: 7px;
    color: var(--muted); cursor: pointer; opacity: .45;
    transition: opacity .12s, background .12s, color .12s;
  }
  .card:hover .more { opacity: 1; }
  .more:hover { background: rgba(255, 255, 255, .09); color: var(--text); }
  body.vertical .more { width: auto; height: 12px; margin: -3px -2px -2px; }
  body.vertical .more svg { transform: rotate(90deg); }
</style>
</head>
<body>
<div class="card" id="card"><span class="empty">…</span></div>
<div class="detail" id="detail"></div>
<script src="i18n.js"></script>
<script>
  // ?view=card shows the rings, ?view=panel the details of the ring that was clicked (see main.js).
  const view = new URLSearchParams(location.search).get('view');
  const root = document.getElementById(view === 'panel' ? 'detail' : 'card');
  document.body.classList.add(`view-${view}`);
  const SERVICES = [
    { key: 'claude', name: 'Claude', color: '#d97757' },
    { key: 'codex', name: 'Codex', color: '#10a37f' },
    { key: 'cursor', name: 'Cursor', color: '#a5b4fc' },
  ];
  const ICON_CLOCK = '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="6.3"/><path d="M8 4.6V8l2.3 1.5"/></svg>';
  const ICON_COIN = '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><ellipse cx="8" cy="5" rx="5.5" ry="2.3"/><path d="M2.5 5v6c0 1.3 2.5 2.3 5.5 2.3s5.5-1 5.5-2.3V5M2.5 8c0 1.3 2.5 2.3 5.5 2.3s5.5-1 5.5-2.3"/></svg>';
  const ICON_MORE = '<svg width="4" height="16" viewBox="0 0 4 16" fill="currentColor"><circle cx="2" cy="3" r="1.5"/><circle cx="2" cy="8" r="1.5"/><circle cx="2" cy="13" r="1.5"/></svg>';

  const ICON_WIFI = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M2.5 9a14 14 0 0 1 19 0M6 12.8a9 9 0 0 1 12 0M9.3 16.4a4.4 4.4 0 0 1 5.4 0"/><circle cx="12" cy="19.6" r="1.4" fill="currentColor" stroke="none"/></svg>';
  const ICON_WIFI_OFF = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M2.5 9a14 14 0 0 1 19 0M6 12.8a9 9 0 0 1 12 0M9.3 16.4a4.4 4.4 0 0 1 5.4 0M3 3l18 18"/><circle cx="12" cy="19.6" r="1.4" fill="currentColor" stroke="none"/></svg>';

  let data = null;
  let network = null; // { online, ms }, null while the internet check is off
  let selected = null; // { svc, index }
  // Pushed by main (see publicSettings in main.js).
  let cfg = { lang: 'en', vertical: false, network: false, services: {}, hidden: {} };
  const T = () => I18N.t(cfg.lang);

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const color = (left) => (left > 50 ? 'var(--ok)' : left > 20 ? 'var(--warn)' : 'var(--bad)');
  // Label under a ring: time left until reset, as days to one decimal (1.3d), else whole hours or minutes;
  // window name if no reset time. Rounded down, so it never shows more time than is left.
  function leftLabel(w) {
    const t = T();
    if (!w.resetsAt) return I18N.windowLabel(w, cfg.lang, true);
    const m = Math.max(0, Math.floor((w.resetsAt - Date.now()) / 60000));
    if (m >= 1440) return t.leftDays((Math.floor(m / 144) / 10).toFixed(1));
    if (m >= 60) return t.leftHours(Math.floor(m / 60));
    return t.leftMinutes(m);
  }
  // Inside the big ring only the span fits ("5h", "7d"); the model name goes in the panel header.
  const ringLabel = (w) => I18N.windowLabel(w.span || w.billing ? { ...w, name: null, tag: null } : w, cfg.lang, true);
  const clamp = (v) => Math.max(0, Math.min(100, v));
  const svcOf = (key) => SERVICES.find((s) => s.key === key);
  const isShown = (key, w) => !(cfg.hidden[key] ?? []).includes(w.id);

  function ringSvg(size, stroke, left, text) {
    const r = size / 2 - stroke / 2 - 1;
    const c = 2 * Math.PI * r;
    const h = size / 2;
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${stroke}"/>
      <circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="${left > 0 ? color(left) : 'none'}" stroke-width="${stroke}"
        stroke-linecap="round" stroke-dasharray="${(clamp(left) / 100) * c} ${c}" transform="rotate(-90 ${h} ${h})"/>
      <text x="${h}" y="${h}" text-anchor="middle" dominant-baseline="central">${esc(text)}</text>
    </svg>`;
  }

  function untilText(ts) {
    let s = Math.max(0, Math.round((ts - Date.now()) / 1000));
    const d = Math.floor(s / 86400); s %= 86400;
    const h = Math.floor(s / 3600); s %= 3600;
    const m = Math.floor(s / 60);
    return T().until(d, h, m);
  }

  function whenText(ts) {
    const t = T();
    const at = new Date(ts);
    const time = at.toLocaleTimeString(t.locale, { hour: '2-digit', minute: '2-digit' });
    const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    const diff = Math.round((day(at) - day(new Date())) / 86400000);
    if (diff === 0) return `${t.today} ${time}`;
    if (diff === 1) return `${t.tomorrow} ${time}`;
    return `${at.toLocaleDateString(t.locale, { weekday: 'short', day: 'numeric', month: 'short' })} ${time}`;
  }

  // ---------- compact card ----------
  function netHtml() {
    if (!cfg.network || !network) return '';
    const t = T();
    const { online, ms } = network;
    return `<div class="svc net ${online ? 'on' : 'off'}" title="${esc(online ? t.online : t.offlineTitle)}">
      <span class="name">${esc(t.net)}</span>
      <div class="net-light"><div class="net-dot">${online ? ICON_WIFI : ICON_WIFI_OFF}</div>
        <span class="lbl">${online ? `${ms} ms` : esc(t.offline)}</span></div></div>`;
  }

  const moreHtml = () => `<div class="more" title="${esc(T().more)}">${ICON_MORE}</div>`;

  function renderCard() {
    const t = T();
    if (!data) {
      root.innerHTML = netHtml() + '<span class="empty">…</span>' + moreHtml();
      return;
    }
    // A service shows when it's switched on, logged in, and has at least one window left on (or an error to show).
    const shown = SERVICES.map((s) => {
      const r = data[s.key];
      if (cfg.services[s.key] === false || !r || r.absent) return null;
      const wins = r.ok ? r.windows.map((w, i) => ({ w, i })).filter(({ w }) => isShown(s.key, w)) : [];
      if (r.ok && r.windows.length && !wins.length) return null;
      return { s, r, wins };
    }).filter(Boolean);
    if (selected && !shown.some(({ s, wins }) => s.key === selected.svc
      && (selected.index < 0 || wins.some(({ i }) => i === selected.index)))) window.overlay.select(null);
    if (!shown.length) {
      const anyOn = SERVICES.some((s) => cfg.services[s.key] !== false && data[s.key] && !data[s.key].absent);
      const allOff = SERVICES.every((s) => cfg.services[s.key] === false);
      root.innerHTML = netHtml() + `<span class="empty">${esc(anyOn || allOff ? t.allOff : t.notLoggedIn)}</span>` + moreHtml();
      return;
    }
    const ring = (s, index, left, label, text) => {
      const sel = selected?.svc === s.key && selected.index === index ? ' sel' : '';
      return `<div class="ring${sel}" style="--accent:${s.color}" data-svc="${s.key}" data-index="${index}">
        ${ringSvg(36, 4, left, text ?? Math.round(left))}<span class="lbl">${esc(label)}</span></div>`;
    };
    root.innerHTML = netHtml() + shown.map(({ s, r, wins }) => {
      const rings = !r.ok ? ring(s, -1, 0, t.error, '!')
        : wins.length ? wins.map(({ w, i }) => ring(s, i, 100 - w.usedPercent, leftLabel(w))).join('')
        : ring(s, -1, 0, t.noData, '–');
      return `<div class="svc"><span class="name" style="color:${s.color}">${s.name}</span><div class="rings">${rings}</div></div>`;
    }).join('') + moreHtml();
  }

  // ---------- detail panel ----------
  function detailHtml(s, r, index) {
    const t = T();
    const w = r.ok && index >= 0 ? r.windows[index] : null;
    const badge = r.ok && r.plan ? `<span class="d-badge">${esc(r.plan.toUpperCase())}</span>` : '';
    const win = w ? `<span class="d-win">${esc(I18N.windowLabel(w, cfg.lang))}</span>` : '';
    const head = `<div class="d-head"><span class="d-dot"></span><span class="d-name">${s.name}</span>${badge}${win}
      <button class="d-close" title="${esc(t.close)}">×</button></div>`;

    if (!r.ok) {
      return `${head}<div class="d-err">${esc(I18N.errorText(r.error, cfg.lang))}</div>
        <div class="d-hint">${esc(t.retryHint)}</div>`;
    }
    if (!w) return `${head}<div class="d-cap">${esc(t.noQuota)}</div>`;

    const left = clamp(100 - w.usedPercent);
    const rows = [];
    if (w.resetsAt) {
      rows.push(`<div class="d-row">${ICON_CLOCK}<span>${esc(t.resetsIn)} <b>${untilText(w.resetsAt)}</b></span><span class="when">${whenText(w.resetsAt)}</span></div>`);
    }
    if (s.key === 'codex' && r.credits) {
      rows.push(`<div class="d-row">${ICON_COIN}<span>${esc(t.creditsLeft)} <b>${Math.floor(r.credits.balance).toLocaleString(t.locale)}</b></span></div>`);
    } else if (r.extra) {
      rows.push(`<div class="d-row">${ICON_COIN}<span>${esc(t.extraUsage)} <b>$${(r.extra.used / 100).toFixed(2)}</b> / $${(r.extra.limit / 100).toFixed(0)}</span></div>`);
    }
    return `${head}
      <div class="d-main">
        ${ringSvg(58, 6, left, ringLabel(w))}
        <div>
          <div class="d-big" style="color:${color(left)}">${Math.round(left)}<small>%</small></div>
          <div class="d-cap">${esc(t.leftUsed(Math.round(w.usedPercent)))}</div>
        </div>
      </div>
      ${rows.length ? `<div class="d-rows">${rows.join('')}</div>` : ''}`;
  }

  function renderDetail() {
    const s = selected && svcOf(selected.svc);
    if (!s || !data?.[s.key]) return;
    root.style.setProperty('--accent', s.color);
    root.innerHTML = detailHtml(s, data[s.key], selected.index);
  }

  function render() {
    if (view === 'card') renderCard();
    else if (data) renderDetail();
  }

  // Main fits this page's window around its element.
  function reportSize() {
    const r = root.getBoundingClientRect();
    window.overlay.size({ w: r.width, h: r.height });
  }
  new ResizeObserver(reportSize).observe(root);

  window.overlay.onQuota((d) => {
    data = d;
    document.body.classList.remove('loading');
    render();
  });
  window.overlay.onSettings((next) => {
    cfg = next;
    document.documentElement.lang = cfg.lang;
    document.body.classList.toggle('vertical', !!cfg.vertical);
    document.body.classList.toggle('offline', !!(cfg.network && network && !network.online));
    render();
  });
  window.overlay.onSelected((next) => {
    selected = next;
    if (view === 'card') return render();
    // Lay the panel out hidden and report its size; main moves the window there, then reveals it.
    root.classList.remove('show');
    root.classList.toggle('open', !!next);
    if (next) {
      renderDetail();
      reportSize();
    }
  });
  // Ring labels and reset times count down.
  setInterval(render, 30 * 1000);

  if (view === 'panel') {
    window.overlay.onReveal(() => root.classList.add('show'));
    root.addEventListener('click', (e) => { if (e.target.closest('.d-close')) window.overlay.select(null); });
  } else {
    window.overlay.onLoading(() => document.body.classList.add('loading'));
    window.overlay.onNetwork((n) => {
      network = n;
      document.body.classList.toggle('offline', !!(cfg.network && n && !n.online));
      render();
    });

    // Drag to move, click a ring to open its details, click elsewhere on the card to close them.
    let drag = null;
    root.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      drag = { x: e.screenX, y: e.screenY, moving: false, target: e.target };
      root.setPointerCapture(e.pointerId);
    });
    // Main moves the window from the real cursor position; the page only says when.
    root.addEventListener('pointermove', (e) => {
      if (!drag) return;
      if (!drag.moving) {
        if (Math.hypot(e.screenX - drag.x, e.screenY - drag.y) < 4) return;
        drag.moving = true;
        document.body.classList.add('dragging');
        window.overlay.dragStart();
      }
      window.overlay.dragMove();
    });
    root.addEventListener('pointerup', () => {
      if (!drag) return;
      if (drag.moving) {
        window.overlay.dragEnd();
      } else if (drag.target.closest('.more')) {
        window.overlay.openSettings();
      } else {
        const r = drag.target.closest('.ring');
        const next = r && { svc: r.dataset.svc, index: Number(r.dataset.index) };
        const same = next && selected?.svc === next.svc && selected.index === next.index;
        window.overlay.select(same ? null : next);
      }
      drag = null;
      document.body.classList.remove('dragging');
    });
    root.addEventListener('dblclick', (e) => { if (!e.target.closest('.ring, .more')) window.overlay.refresh(); });
    root.addEventListener('contextmenu', (e) => { e.preventDefault(); window.overlay.menu(); });
  }
</script>
</body>
</html>
